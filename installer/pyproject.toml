[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trugs-agent"
version = "2.0.0"
description = "TRUGS onboarding instructions and project installer"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["trugs-tools>=2.4.0,<3", "markdown-it-py>=4.2,<5"]
authors = [{name = "TRUGS LLC"}]

[project.urls]
Homepage = "https://github.com/TRUGS-LLC/TRUGS-AGENT"
Repository = "https://github.com/TRUGS-LLC/TRUGS-AGENT"

[project.scripts]
trugs-agent = "trugs_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trugs_agent = ["payload/AGENTS.md", "payload/CLAUDE.md", "payload/.cursor/rules/trugs-agent.mdc", "payload/.claude-plugin/plugin.json"]
